<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Evgeny Shtein favicon</title>
  <desc id="desc">Clear ES monogram favicon on a dark teal background.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10201f"/>
      <stop offset="60%" stop-color="#173430"/>
      <stop offset="100%" stop-color="#2b2a25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d58a"/>
      <stop offset="100%" stop-color="#e5b95f"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <path d="M16 18H48" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
  <path d="M16 32H48" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
  <path d="M16 46H48" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
  <path d="M46 14c0 4-3 7-7 7" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="46" cy="14" r="2.1" fill="url(#gold)"/>

  <text x="17" y="42"
        fill="#fff8ea"
        font-family="Arial Black, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="23"
        font-weight="900"
        letter-spacing="-1">E</text>
  <text x="31" y="42"
        fill="url(#gold)"
        font-family="Arial Black, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="23"
        font-weight="900"
        letter-spacing="-1">S</text>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
</svg>
