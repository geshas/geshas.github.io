<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Evgeny Shtein favicon</title>
  <desc id="desc">Clean ES initials on a dark teal background.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10201f"/>
      <stop offset="100%" stop-color="#1d3f3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d58a"/>
      <stop offset="100%" stop-color="#e5b95f"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <path d="M16 18H48" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
  <path d="M16 46H48" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
  <text x="15" y="43"
        fill="#fff8ea"
        font-family="Verdana, Arial, sans-serif"
        font-size="26"
        font-weight="700">E</text>
  <text x="32" y="43"
        fill="url(#gold)"
        font-family="Verdana, Arial, sans-serif"
        font-size="26"
        font-weight="700">S</text>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
</svg>
